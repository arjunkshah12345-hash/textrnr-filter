<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>textrnr — night grade</title>
    <meta
      name="description"
      content="Open-source soft-focus night filter. Soft bloom, cool shadows, colored grain. Runs in your browser — nothing leaves your device."
    />
    <meta property="og:title" content="textrnr filter" />
    <meta
      property="og:description"
      content="Soft focus, amber bloom, cool shadows, dense film grain."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://arjunkshah12345-hash.github.io/textrnr-filter/"
    />
    <meta name="theme-color" content="#0e0c0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;550;650&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <aside class="rail">
      <header class="rail-top">
        <h1 class="brand">textrnr</h1>
        <a
          class="gh"
          href="https://github.com/arjunkshah12345-hash/textrnr-filter"
          target="_blank"
          rel="noreferrer"
          >Source</a
        >
      </header>

      <p class="lede">
        Soft focus night grade.<br />
        Amber bloom, cool shadows, grain.<br />
        Stays on your device.
      </p>

      <div
        class="drop"
        id="drop"
        role="button"
        tabindex="0"
        aria-label="Upload an image"
      >
        <span class="drop-title">Drop a photo</span>
        <span class="drop-hint">or paste · jpg / png / webp</span>
      </div>
      <input id="file" type="file" accept="image/*" hidden />

      <div class="presets" id="presets" aria-label="Presets">
        <button type="button" class="chip is-on" data-preset="classic">Classic</button>
        <button type="button" class="chip" data-preset="soft">Soft</button>
        <button type="button" class="chip" data-preset="heavy">Heavy</button>
        <button type="button" class="chip" data-preset="cold">Cold</button>
      </div>

      <div class="controls">
        <div class="control">
          <div class="control-row">
            <label for="strength">Strength</label>
            <output id="strength-val">1.00</output>
          </div>
          <input id="strength" type="range" min="0.4" max="1.6" step="0.05" value="1" />
        </div>
        <div class="control">
          <div class="control-row">
            <label for="blur">Soft focus</label>
            <output id="blur-val">14</output>
          </div>
          <input id="blur" type="range" min="4" max="28" step="1" value="14" />
        </div>
        <div class="control">
          <div class="control-row">
            <label for="grain">Grain</label>
            <output id="grain-val">38</output>
          </div>
          <input id="grain" type="range" min="8" max="64" step="1" value="38" />
        </div>
        <div class="control">
          <div class="control-row">
            <label for="warmth">Warm / cool</label>
            <output id="warmth-val">0.20</output>
          </div>
          <input id="warmth" type="range" min="0" max="0.45" step="0.01" value="0.2" />
        </div>
        <div class="control">
          <div class="control-row">
            <label for="vignette">Vignette</label>
            <output id="vignette-val">0.58</output>
          </div>
          <input id="vignette" type="range" min="0" max="0.9" step="0.01" value="0.58" />
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="process" type="button" disabled>Apply</button>
        <button class="ghost" id="download" type="button" disabled>Download</button>
        <button class="ghost" id="sample" type="button">Sample</button>
      </div>

      <p class="status" id="status">Loading sample…</p>

      <p class="foot">
        MIT ·
        <a href="https://github.com/arjunkshah12345-hash/textrnr-filter">GitHub</a>
        · Python CLI in <code>python/</code>
      </p>
    </aside>

    <section class="stage" id="stage" aria-label="Preview">
      <div class="compare" id="compare" hidden>
        <div class="compare-stack" id="compare-stack">
          <canvas id="compare-after" aria-hidden="true"></canvas>
          <div class="compare-before-wrap" id="before-wrap">
            <canvas id="compare-before" aria-hidden="true"></canvas>
          </div>
          <input
            class="compare-range"
            id="compare-range"
            type="range"
            min="0"
            max="100"
            value="50"
            aria-label="Compare before and after"
          />
          <div class="compare-labels">
            <span>Before</span>
            <span>After</span>
          </div>
        </div>
      </div>

      <div class="pair" id="pair">
        <div class="frame">
          <p class="frame-label">Before</p>
          <div id="before"></div>
        </div>
        <div class="frame">
          <p class="frame-label">After</p>
          <div id="after">
            <p class="placeholder">Your grade appears here.</p>
          </div>
        </div>
      </div>
    </section>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
